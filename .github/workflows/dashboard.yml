name: Dashboard sommet de cycle

on:
  schedule:
    - cron: "0 12 * * 1"      # chaque lundi 12:00 UTC
  workflow_dispatch:           # + bouton "Run workflow" manuel
    inputs:
      test_alert:
        description: "Créer une alerte de TEST (vérif notifications)"
        type: boolean
        default: false

permissions:
  contents: write              # committer state.json (persistance du delta ETF)
  issues: write                # ouvrir une issue = email d'alerte sur franchissement
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install certifi

      - name: Calcul du score composite
        run: |
          mkdir -p public
          python score.py public/index.html
          cp plan.html recap.html public/ 2>/dev/null || true   # pages statiques (accès mobile)

      - name: Alertes (paliers score + paliers ladder)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(jq '.alerts | length' alert.json 2>/dev/null || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            for i in $(seq 0 $((COUNT-1))); do
              jq -r ".alerts[$i].body" alert.json > _body.md
              gh issue create --title "$(jq -r ".alerts[$i].title" alert.json)" --body-file _body.md
            done
            echo "$COUNT alerte(s) — issue(s) créée(s), email(s) envoyé(s)."
          else
            echo "Aucune alerte ce run."
          fi

      - name: Alerte de TEST (sur demande manuelle)
        if: ${{ inputs.test_alert }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            'Test du systeme alerte, cree par le bot GitHub Actions (exactement comme les vraies alertes de palier).' '' \
            'Si tu recois cette notification (push mobile + email), la chaine fonctionne de bout en bout. 🎉' '' \
            'Tu peux refermer cette issue.' > _test_body.md
          gh issue create --title "[TEST] Verification des notifications" --body-file _test_body.md
          echo "Issue de test creee."

      - name: Persister l'état (state.json)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "maj etat $(date -u +%F)" || echo "rien a committer"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
